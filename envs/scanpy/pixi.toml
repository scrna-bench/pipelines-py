# scanpy pipeline (CPU). Pins follow the v1.1 benchmark image (py.def).
[workspace]
name = "pipelines-py-scanpy"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
numpy = "==2.1.3"
scipy = "==1.15.2"
pandas = "==2.2.3"
scikit-learn = "==1.6.1"
numba = "==0.61.0"
h5py = "==3.13.0"
anndata = "==0.11.3"
scanpy = "==1.10.4"
umap-learn = "==0.5.7"
pynndescent = "==0.5.13"
python-igraph = "==0.11.8"
leidenalg = "==0.10.2"
louvain = "==0.8.2"
# louvain 0.8.2 imports pkg_resources, which setuptools >= 81 no longer ships
setuptools = "==75.8.2"
statsmodels = "==0.14.4"
polars = "==2.1.0"

[pypi-dependencies]
obkit = "==0.0.4"
